<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Potato Gateway</title>
<style>
  :root { --bg:#faf7f0; --fg:#2b2620; --muted:#7a6f60; --card:#fff; --line:#e6dfd2; --accent:#b8860b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1b1916; --fg:#ece6da; --muted:#a39886; --card:#25221e; --line:#3a352e; --accent:#e0b04a; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif; }
  main { max-width:880px; margin:0 auto; padding:32px 16px; }
  h1 { margin:0 0 4px; } p.sub { margin:0 0 20px; color:var(--muted); }
  input { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--fg); font:inherit; margin-bottom:16px; }
  .grid { display:grid; gap:12px; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .card h2 { font-size:17px; margin:0 0 4px; } .card p { margin:0 0 10px; color:var(--muted); font-size:14px; }
  .links a { color:var(--accent); margin-right:10px; font-size:14px; text-decoration:none; }
  .card h2 a.main { color:inherit; text-decoration:none; }
  .tag { display:inline-block; font-size:12px; border:1px solid var(--line); border-radius:99px; padding:0 8px; margin:0 4px 8px 0; color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>🥔 Potato Gateway</h1>
  <p class="sub">potato series sitemap</p>
  <input id="q" placeholder="검색 (이름, 설명, 태그)">
  <div class="grid" id="list"></div>
</main>
<script>
fetch('projects.json').then(r => r.json()).then(reg => {
  const gh = n => `https://github.com/${reg.owner}/${n}`;
  const render = q => {
    document.getElementById('list').innerHTML = reg.projects
      .filter(p => (p.name + p.description + p.tags.join(' ')).toLowerCase().includes(q))
      .map(p => `<div class="card">
        <h2>${p.url ? `<a class="main" href="${p.url}">${p.name}</a>` : p.name}</h2><p>${p.description || ''}</p>
        ${p.tags.map(t => `<span class="tag">${t}</span>`).join('')}
        <div class="links">${p.url ? `<a href="${p.url}">열기 →</a>` : '<span class="tag">준비중</span>'}<a href="${gh(p.name)}">repo</a></div>
      </div>`).join('');
  };
  document.getElementById('q').oninput = e => render(e.target.value.toLowerCase());
  render('');
});
</script>
</body>
</html>
