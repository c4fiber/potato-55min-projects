name: sitemap-pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - run: mkdir _site && cp index.html projects.json _site/
      - uses: actions/upload-pages-artifact@v3
      - uses: actions/deploy-pages@v4
